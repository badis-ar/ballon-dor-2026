# Télécharge les données brutes (Wikipédia, openfootball, Polymarket, Kalshi)
# et les enregistre dans data/brut/. Lancement manuel uniquement : les cotes
# et les pages Wikipédia changent après la cérémonie, on fige donc la date de collecte.
name: Collecter les données

on:
  workflow_dispatch:
  push:
    branches: [refonte]
    paths: [src/collecte.py]

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Télécharger
        run: python src/collecte.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brut
          git diff --cached --quiet && echo "Rien de nouveau." && exit 0
          git commit -m "Collecte des données du $(date -u +%Y-%m-%d)"
          git push
