# Prépare les données, applique le modèle et publie la page sur GitHub Pages.
# Aucun téléchargement ici : la page est construite à partir des fichiers de data/.
name: Construire et publier la page

on:
  push:
    branches: [main]        # à chaque modification (poids, fichiers FBref déposés...)
  pull_request:             # sur une pull request : construction seule, sans publication
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Préparer les données
        run: python src/preparation.py
      - name: Appliquer le modèle et construire la page
        run: python src/construire.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publier:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
